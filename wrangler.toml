name = "sira-gunluk"
main = "worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[kv_namespaces]]
binding = "SIRA"
id = "76f6b9fe118a4558b30c8b9b92096428"

[[durable_objects.bindings]]
name = "SIRA_ROOM"
class_name = "SiraStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiraStore"]
